<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大正藏 → 高麗藏 位置轉換</title>
<style>
  :root { --fg:#1c1c1e; --dim:#6b6b70; --line:#d8d8dd; --accent:#0b6bcb; --bg:#fafaf9; }
  * { box-sizing:border-box; }
  body { margin:0; padding:2rem 1.25rem; background:var(--bg); color:var(--fg);
         font:15px/1.7 "Noto Serif TC","Songti TC",serif; }
  main { max-width:46rem; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  p.lead { color:var(--dim); margin:0 0 1.5rem; font-size:.9rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; }
  input[type=text] { flex:1 1 16rem; font:1rem/1.5 ui-monospace,Consolas,monospace;
         padding:.55rem .7rem; border:1px solid var(--line); border-radius:.4rem; background:#fff; }
  button { font:inherit; padding:.55rem 1.1rem; border:0; border-radius:.4rem;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { background:#9bb8d8; cursor:progress; }
  .examples { margin:.75rem 0 0; font-size:.85rem; color:var(--dim); }
  .examples code { cursor:pointer; border-bottom:1px dotted var(--line); }
  table { border-collapse:collapse; width:100%; margin-top:1.5rem; font-size:.95rem; }
  th,td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { width:9rem; color:var(--dim); font-weight:400; }
  td.mono { font-family:ui-monospace,Consolas,monospace; }
  .k { color:var(--accent); font-weight:700; }
  .bad { color:#b3261e; }
  .warn { background:#fff6e0; border:1px solid #f0d9a0; padding:.6rem .8rem; border-radius:.4rem;
          margin-top:1.25rem; font-size:.85rem; }
  .note { color:var(--dim); font-size:.85rem; margin-top:.75rem; }
</style>
</head>
<body>
<main>
  <h1>大正藏 → 高麗藏 位置轉換</h1>
  <p class="lead">輸入大正藏位置，取得精確到字的高麗藏位置。頁面只載入 <code>posdata/*.json</code>，不需要資料庫。</p>

  <div class="row">
    <input type="text" id="addr" value="T01p0002c0405" spellcheck="false" autocomplete="off">
    <button id="go">轉換</button>
  </div>
  <p class="examples">試試：
    <code>T01p0002c0405</code>　
    <code>T01p0001a0500</code>（序文）　
    <code>T01p0011a0100</code>（卷末）　
    <code>T01p0001b1100</code>
  </p>

  <div id="out"></div>

  <div class="warn" id="hint" hidden></div>

  <p class="note">
    位置格式沿用行業慣例：<code>T01p0002c0405</code> = 大正藏第 1 冊第 0002 頁 c 欄第 04 行第 05 個字之前；
    偏置只數 CJK 表意字符，標點與標記不計，故 0 在「如」左邊、1 在「如」右邊。K 開頭即為高麗藏位置。
  </p>
</main>

<script type="module">
import { loadSource, convertTaishoGoryeo, parseAddress, formatAddress } from "./webdist/posweb.js";

const $addr = document.getElementById("addr");
const $go = document.getElementById("go");
const $out = document.getElementById("out");
const $hint = document.getElementById("hint");

// 目前只有 T0001（長阿含經，高麗 0647）的對照檔；之後可用 buildpos.ts 匯出更多。
const FILES = ["./posdata/0001.json"];
let srcPromise = null;
const getSource = () => (srcPromise ??= loadSource(FILES));

const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function run() {
  $out.innerHTML = "";
  $hint.hidden = true;
  const a = parseAddress($addr.value);
  if (!a) { $out.innerHTML = `<p class="bad">位址無法解析：${esc($addr.value)}</p>`; return; }
  if (a.side !== "T") { $out.innerHTML = `<p class="bad">請輸入大正藏位址（T 開頭）</p>`; return; }

  $go.disabled = true;
  try {
    const src = await getSource();
    let rec = null;
    for (const tsutra of ["0001"]) {
      for (let j = 1; j <= 22; j++) {
        const r = src.align(tsutra, j);
        if (!r || r.t.vol !== a.vol) continue;
        const seq = a.page * 1000 + a.col * 100 + a.line;
        if (r.t.lineSeq.some(s => s === seq)) { rec = r; break; }
      }
      if (rec) break;
    }
    if (!rec) { $out.innerHTML = `<p class="bad">位置不在已收錄的經卷中（目前僅 T0001 長阿含經）</p>`; return; }

    const res = convertTaishoGoryeo(rec, a);
    if (!res.ok) { $out.innerHTML = `<p class="bad">${esc(res.note)}</p>`; return; }
    $out.innerHTML = `
      <table>
        <tr><th>輸入</th><td class="mono">${esc(res.input)}</td></tr>
        <tr><th>高麗藏</th><td class="mono k">${esc(res.koryo)}</td></tr>
        <tr><th>修正後大正藏</th><td class="mono">${esc(res.adjustedTaisho)}</td></tr>
        <tr><th>經卷</th><td>T${esc(res.tsutra)} 卷 ${res.tjuan} ⇄ K${esc(res.ksutra)} 卷 ${res.kjuan}</td></tr>
        <tr><th>頁欄行</th><td class="mono">${esc(res.tPcl)} 第 ${res.tOff} 字 → ${esc(res.kPcl)} 第 ${res.kOff} 字</td></tr>
        <tr><th>調整</th><td>${res.adjust === "none" ? "—" : esc(res.adjust)}</td></tr>
        ${res.note ? `<tr><th>備註</th><td>${esc(res.note)}</td></tr>` : ""}
      </table>`;
  } catch (e) {
    $hint.hidden = false;
    $hint.innerHTML = `載入 <code>posdata/0001.json</code> 失敗：${esc(e.message)}<br>
      本頁是 ES module，必須用 HTTP 開啟，不能直接雙擊檔案。在專案目錄執行
      <code>bunx --bun serve .</code> 或 <code>python -m http.server</code>，再開
      <code>http://localhost:3000/posdemo.html</code>。`;
  } finally {
    $go.disabled = false;
  }
}

$go.addEventListener("click", run);
$addr.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
for (const c of document.querySelectorAll(".examples code")) {
  c.addEventListener("click", () => { $addr.value = c.textContent; run(); });
}
</script>
</body>
</html>
