function convertT(raw) {
  const m = /^T(\d{1,2})p?(\d{4})([a-g])(\d{2})(?:\.(\d+)|(\d{2}))?$/i.exec(String(raw || "").trim());
  if (!m) return { ok: false, msg: "位址格式看不懂。請照 <b>T</b> ＋ 冊 ＋ <b>p</b> ＋ 頁 ＋ 欄 ＋ 行 ＋ 字，例如 <code>T01p0005b0503</code>" };

  if (i < 0) return { ok: false, msg: "這個位置不在內建的對照範圍內。<br>本頁收錄大正藏第 1–85 冊中可與高麗藏對照的 1,474 部經。" };
  const r = recAt(i);
  const f = findLine(r.t, seqOfPcl(pcl));

/* 範例數由 SAMPLES 現算，日後增減範例不必再改這句話 */
const NO_TEXT = () => '<div class="none"><b>無庫存經文</b><br>位置已轉換，但本頁只內建下方 ' +
  SAMPLES.length + ' 個範例的經文。</div>';

/* ---------- 下拉選單 ---------- */
let SUTRAS = null;                       // 每筆＝一個（經, 冊）組合
const KEY2I = new Map();                 // "經號/卷" → IDX 索引

function buildIndex() {
  for (let i = 0; i < IDX.length; i++) KEY2I.set(IDX[i].ts + "/" + IDX[i].tjuan, i);
  const byKey = new Map();
  for (const e of IDX) {
    const k = e.ts + "@" + e.tVol;
    if (!byKey.has(k)) byKey.set(k, { ts: e.ts, tVol: e.tVol, juans: [], name: (NAMES && NAMES.t[e.ts]) || "" });
    byKey.get(k).juans.push(e.tjuan);

  for (const s of SUTRAS) s.juans.sort((a, b) => a - b);
  const cnt = new Map();
  for (const s of SUTRAS) cnt.set(s.ts, (cnt.get(s.ts) || 0) + 1);
  for (const s of SUTRAS) s.nVols = cnt.get(s.ts);   // 這部經橫跨幾冊
  BYVOL = new Map();
  for (let i = 0; i < SUTRAS.length; i++) {

}

    const s = SUTRAS[i];
    // 橫跨多冊的經（如大般若經），卷次範圍依「本冊」實際的卷現算，不用經名裡那個舊註記
    const rng = s.nVols > 1 ? "（卷 " + s.juans[0] + "–" + s.juans[s.juans.length - 1] + "）" : "";

}

/** 範例鈕：把位址填進去、下拉同步、顯示該範例的逐行對照 */

  renderFor(a);
}
function init() {

  fillSutra(VOLS[0]);

  const box = $("samples");
  box.innerHTML = SAMPLES.map((s, i) =>
    '<button data-i="' + i + '"><b>' + esc(s.name) + "</b><span>" + esc(s.note) + "</span></button>").join("");

  });

}

/* ---- 明暗切換 ---- */
function applyTheme(mode) {
  try { document.documentElement.setAttribute("data-theme", mode); } catch (e) {}
  const b = $("theme");
  if (!b) return;
  b.textContent = mode === "dark" ? "亮底" : "暗底";
  b.setAttribute("aria-pressed", mode === "dark" ? "true" : "false");
  b.title = mode === "dark" ? "切換為亮底" : "切換為暗底";
}
function currentTheme() {
  try { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; } catch (e) { return "light"; }
}

  let mode = "light";
  try { const s = localStorage.getItem("tmTheme"); if (s === "dark" || s === "light") mode = s; } catch (e) {}
  applyTheme(mode);
  const b = $("theme");
  if (!b) return;
  b.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("tmTheme", next); } catch (e) {}
  });
}
initTheme();

(async () => {
  const el = $("hint");
  try {
    el.textContent = "　載入對照資料…";
    await load();
    el.textContent = "";
    init();
  } catch (err) {
    el.textContent = "　載入失敗：" + err;
    showText('<div class="none">資料載入失敗。<br>請確認使用的是較新的瀏覽器（Chrome 80+、Firefox 113+、Safari 16.4+）。</div>');
  }
})();
</script>
</body>
